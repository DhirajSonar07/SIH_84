services:
  - type: web
    name: novexa-nowcast-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: CORS_ORIGINS
        sync: false
      - key: ANALYSIS_RESOLUTION
        value: COARSE
      - key: LOG_LEVEL
        value: INFO
